<style>
/* Concept: the printed Bahida menu turned into a storefront — cream paper, gold ornament, espresso ink. Menu -> cart -> WhatsApp. */

:root[data-theme="dark"]{

  --brand:#E3B25A; --brand-2:#F0C877; --on-brand:#2B1B12; --gold:#E3B25A; --gold-soft:#3B2D12;
  --wa:#2BBF68; --on-wa:#04210F; --focus:#E3B25A; --imgbg:#EFE6D2; --dark:#0E0906; color-scheme:dark}

body{background-color:var(--bg);background-image:radial-gradient(900px 520px at 0% 0%,rgba(184,134,43,.18),transparent 70%),radial-gradient(800px 600px at 100% 38%,rgba(176,70,45,.10),transparent 70%),radial-gradient(900px 600px at 0% 78%,rgba(184,134,43,.14),transparent 70%),url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='88' height='88' viewBox='0 0 88 88'><g fill='none' stroke='%23B8862B' stroke-opacity='.22' stroke-width='1'><rect x='24' y='24' width='40' height='40'/><rect x='24' y='24' width='40' height='40' transform='rotate(45 44 44)'/><circle cx='44' cy='44' r='6'/><path d='M0 0l12 12M88 0L76 12M0 88l12-12M88 88L76 76'/></g></svg>");background-attachment:scroll}

.hero{background:transparent!important;padding-bottom:80px}

  $('.lead').textContent=t('lead',ITEMS.length);
  $('#facts').innerHTML=[t('f1',ITEMS.length),t('f2'),t('f3'),t('f4')].map(x=>`<li>${ic('i-check')}<span>${x}</span></li>`).join('');
  $('#steps').innerHTML=(S.lang==='en'?EN_STEPS.map(x=>[[x[0]],[x[1]]]).map(x=>[[x[0][0]],[x[1][0]]]):T.steps).map(s=>`<li><div><b>${S.lang==='en'?s[0][0]:s[0][L()]}</b><span>${S.lang==='en'?s[1][0]:s[1][L()]}</span></div></li>`).join('');
  $('#q').placeholder=t('search');$$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));renderGal();renderLoc();
  $('#heroWa').href=$('#bandWa').href=$('#barWa').href=$('#fab').href=wa(t('hello'));
  document.title=t('title');
}
function renderCart(){
  const tt=totals(),body=$('#cartBody'),foot=$('#cartFoot');
  $('#cartTitle').textContent=t('cart_h')+(tt.n?` (${tt.n})`:'');
  if(!tt.n){body.innerHTML=`<div class="cart-empty">${ic('i-cart')}<p>${t('cart_empty')}</p><button class="btn btn-brand" type="button" data-close-cart>${t('cta_menu')}</button></div>`;foot.hidden=true;foot.innerHTML='';return}
  foot.hidden=false;
  body.innerHTML=Object.keys(S.cart).map(id=>{const x=IM.get(id);return `<div class="ln"><div class="t">${esc(nm(x))}<small class="num">${x.p} ${cur()}</small></div><div class="stepper"><button type="button" data-dec="${id}" aria-label="−">${ic('i-minus')}</button><output class="num">${S.cart[id]}</output><button type="button" data-inc="${id}" aria-label="+">${ic('i-plus')}</button></div><span class="lt num">${x.p*S.cart[id]}</span><button class="rm" type="button" data-rm="${id}" aria-label="×">${ic('i-trash')}</button></div>`}).join('');
  const k=id=>($('#'+id)||{}).value||'';
  foot.innerHTML=`<div class="sum"><span>${t('total')}</span><b class="num">${tt.s} ${cur()}</b></div>
  <div class="seg"><button type="button" data-mode="here" aria-pressed="${S.mode==='here'}">${t('here')}</button><button type="button" data-mode="take" aria-pressed="${S.mode==='take'}">${t('take')}</button></div>
  <div class="fields"><input id="fName" type="text" autocomplete="name" placeholder="${t('f_name')}" aria-label="${t('f_name')}" value="${esc(k('fName'))}">${S.mode==='here'?`<input id="fTable" type="text" inputmode="numeric" placeholder="${t('f_table')}" aria-label="${t('f_table')}" value="${esc(k('fTable'))}">`:'<span></span>'}<textarea id="fNotes" placeholder="${t('f_notes')}" aria-label="${t('f_notes')}">${esc(k('fNotes'))}</textarea></div>
  <a class="btn btn-wa" id="sendWa" href="${wa(orderText())}" target="_blank" rel="noopener">${ic('i-wa','fill')}<span>${t('send')}</span></a>
  <button class="btn btn-ghost btn-sm" type="button" data-copy-order>${ic('i-copy')}<span>${t('copy')}</span></button><p class="fine">${t('note')}</p><a class="rev-mini" href="https://maps.app.goo.gl/BswMgFYyKKZbw6BCA" target="_blank" rel="noopener">${ic('i-star','fill')}<span>${t('rev_cart')}</span></a>`;
}
const open=()=>$('#drawer').classList.contains('on');
function sync(){
  const tt=totals();$('#hCnt').textContent=tt.n;$('#hCnt').dataset.n=tt.n;$('#barTxt').textContent=t('bar');$('#barTot').textContent=tt.n?`${tt.n} · ${tt.s} ${cur()}`:'';
  $$('[data-actfor]').forEach(e=>{e.innerHTML=actHTML(e.dataset.actfor)});
  const a=document.activeElement,keep=a&&['fName','fTable','fNotes'].includes(a.id)?{id:a.id,s:a.selectionStart}:null;
  renderCart();if(keep){const e=$('#'+keep.id);if(e){e.focus();try{e.setSelectionRange(keep.s,keep.s)}catch(_){}}}
}
function openCart(){renderCart();$('#drawer').inert=false;$('#drawer').classList.add('on');$('#scrim').classList.add('on')}
function closeCart(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');$('#drawer').inert=true}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2000)}
function copyT(s){const ok=()=>toast(t('copied')),no=()=>toast(t('cfail'));const lg=()=>{try{const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const r=document.execCommand('copy');a.remove();r?ok():no()}catch(e){no()}};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(s).then(ok,lg):lg()}
const lbT=(k)=>t(k);
function renderGal(){
  const tabs=['all','drinks','sweets','place'];
  $('#gtabs').innerHTML=tabs.map(k=>`<button class="gtab" type="button" data-g="${k}" aria-pressed="${S.g===k}">${t('g_'+k)}</button>`).join('');
  const list=GAL.filter(g=>S.g==='all'||g[1]===S.g);
  $('#gal').innerHTML=list.map((g,i)=>`<button class="ph${WIDE.has(g[0])?'':''}" type="button" data-ph="gal" data-n="${i}" aria-label="${esc(t('g_'+g[1]))} ${i+1}"><img src="img/${g[0]}t.webp" alt="${esc(t('g_'+g[1]))}" loading="lazy" decoding="async"><span class="zm">${ic('i-zoom')}</span></button>`).join('');
}
function renderLoc(){
  $('#locPh').innerHTML=LOC.map((g,i)=>`<button class="ph ${g[1]}" type="button" data-ph="loc" data-n="${i}" aria-label="${esc(t(g[2]))}"><img src="img/${g[0]}t.webp" alt="${esc(t(g[2]))}" loading="lazy" decoding="async"><span class="cap">${t(g[2])}</span><span class="zm">${ic('i-zoom')}</span></button>`).join('');
}
const LB={list:[],i:0};let lbPrev=null;
function lbShow(){const g=LB.list[LB.i];$('#lbImg').src='img/'+g.f+'.webp';$('#lbImg').alt=g.c;$('#lbCap').textContent=g.c+'  ·  '+(LB.i+1)+' / '+LB.list.length;const one=LB.list.length<2;$$('#lb .pv,#lb .nx').forEach(b=>b.hidden=one);
  [1,-1].forEach(d=>{const j=(LB.i+d+LB.list.length)%LB.list.length;new Image().src='img/'+LB.list[j].f+'.webp'})}
function lbOpen(kind,i){
  LB.list=kind==='loc'?LOC.map(g=>({f:g[0],c:t(g[2])})):GAL.filter(g=>S.g==='all'||g[1]===S.g).map(g=>({f:g[0],c:t('g_'+g[1])}));
  LB.i=i;lbPrev=document.activeElement;const b=$('#lb');b.hidden=false;b.classList.add('on');document.body.style.overflow='hidden';lbShow();$('#lb .x').focus()}
function lbClose(){const b=$('#lb');b.classList.remove('on');b.hidden=true;document.body.style.overflow='';if(lbPrev&&lbPrev.focus)lbPrev.focus()}
function lbGo(d){LB.i=(LB.i+d+LB.list.length)%LB.list.length;lbShow()}
let tx=null;
document.addEventListener('touchstart',e=>{if(e.target.closest('#lb'))tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)lbGo(dx<0?1:-1)},{passive:true});
function applyLang(){document.documentElement.lang=app.lang=S.lang;document.documentElement.dir=app.dir=S.lang==='ar'?'rtl':'ltr';save();renderStatic();renderTabs();renderMenu();renderPicks();sync()}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);let el;
  if((el=q('[data-add]'))){setQ(el.dataset.add,1);toast(t('added',nm(IM.get(el.dataset.add))));return}
  if((el=q('[data-inc]'))){setQ(el.dataset.inc,q0(el.dataset.inc)+1);return}
  if((el=q('[data-dec]'))){setQ(el.dataset.dec,q0(el.dataset.dec)-1);return}
  if((el=q('[data-rm]'))){setQ(el.dataset.rm,0);return}
  if((el=q('[data-cat]'))){S.cat=el.dataset.cat;renderTabs();renderMenu();sync();return}
  if((el=q('[data-mode]'))){S.mode=el.dataset.mode;renderCart();return}
  if(q('[data-open-cart]')){openCart();return}
  if(q('[data-close-cart]')||e.target===$('#scrim')){closeCart();return}
  if(q('[data-copy-order]')){copyT(orderText());return}
  if((el=q('.langs [data-lang]'))){S.lang=el.dataset.lang;applyLang();return}
  if((el=q('[data-g]'))){S.g=el.dataset.g;renderGal();return}
  if((el=q('[data-ph]'))){lbOpen(el.dataset.ph,+el.dataset.n);return}
  if((el=q('[data-lb]'))){const a=el.dataset.lb;a==='close'?lbClose():lbGo(a==='next'?1:-1);return}
  if(e.target===$('#lb'))lbClose();
});
document.addEventListener('keydown',e=>{if($('#lb').classList.contains('on')){if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbGo(1);else if(e.key==='ArrowLeft')lbGo(-1);return}if(e.key==='Escape'&&open())closeCart()});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value.trim();renderMenu();sync()}
  else if(['fName','fTable','fNotes'].includes(e.target.id)){const a=$('#sendWa');if(a)a.href=wa(orderText())}
});
applyLang();
})();
</script>

</body></html>
